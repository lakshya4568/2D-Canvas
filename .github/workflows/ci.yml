name: UPCE CI Pipeline

on:
  push:
    branches: [main, upce_master_init_foundation, parametric_formulation]
  pull_request:
    branches: [main, upce_master_init_foundation]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run CI Dependency License Scanner (§2.10, §84)
        run: bun run license:scan

      - name: Run Tolerance & Shape Branching Lint (§2.4, §2.5, §17)
        run: bun run lint:tolerance

      - name: Verify Schema Type Generation (§5.1, §25)
        run: bun run generate:types

      # §14: "shared TypeScript types are generated from the JSON Schema, never
      # hand-duplicated." If regeneration changes a committed file, the schema
      # and the types have drifted and the build must fail.
      - name: Fail on generated-type drift (§14)
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::Generated types differ from the committed ones."
            echo "Run 'bun run generate:types' and commit the result."
            exit 1
          fi

      - name: Typecheck (§14 one contract, three languages)
        run: bun x tsc --noEmit

      - name: Run Comprehensive Test Suite & Acceptance Gates (§75, §76)
        run: bun test
